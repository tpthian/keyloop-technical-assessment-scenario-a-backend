name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # No database service: the tests start their own PostgreSQL 16 with testcontainers
    # (ADR-002) on the runner's Docker.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run pre-commit run --all-files
      - run: uv run mypy src tests/fakes.py
      - run: uv run pytest -q
